<!--
  Gradient runs brand-500 -> violet-600 (apps/web/tailwind.config.js) — both
  now real theme tokens, not one-off hex values that only existed in this
  file. Previously the app went the other way (the logo was flattened to
  match the app's then-flat primary color); now the app's primary buttons
  use this same gradient instead, so the logo and the app share one
  palette regardless of which direction the match happens.
-->
<svg width="256" height="256" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="256" rx="112" fill="url(#sheen)"/>
  <rect x="128" y="256" width="168" height="168" rx="32" fill="#4338ca" fill-opacity="0.68" transform="rotate(-12 212 340)"/>
  <rect x="168" y="192" width="168" height="168" rx="32" fill="#4338ca" fill-opacity="0.92" transform="rotate(-4 252 276)"/>
  <rect x="208" y="128" width="168" height="168" rx="32" fill="#ffffff" transform="rotate(6 292 212)"/>
</svg>
